name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This repo owns its copy of this workflow; the shared jobs are pinned by SHA.
# No native android/ios projects exist yet, so the build is the Metro Android
# JS bundle (a real production bundle of the app code), not an APK/IPA.
jobs:
  app:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      coverage-threshold: "97"   # measured jest line coverage, rounded down (ratchet up, never down)
      build-command: mkdir -p dist && npm run bundle:android

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
